name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build release APK and AAB
        working-directory: android
        env:
          TOUCH_UPLOAD_STORE_FILE: release.keystore
          TOUCH_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TOUCH_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TOUCH_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Name release APK
        run: |
          version_name=$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' android/app/build.gradle)
          test -n "$version_name"
          echo "RELEASE_VERSION=$version_name" >> "$GITHUB_ENV"
          mv android/app/build/outputs/apk/release/app-release.apk \
            "android/app/build/outputs/apk/release/touch_v${version_name}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish versioned Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find android/app/build/outputs/apk/release -name 'touch_v*.apk' -print -quit)
          tag="v${RELEASE_VERSION}"
          gh release delete latest --yes --cleanup-tag || true
          if gh release view "$tag"; then
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release upload "$tag" "$apk"
            gh release edit "$tag" --target "$GITHUB_SHA" --title "Touch v${RELEASE_VERSION}"
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "Touch v${RELEASE_VERSION}" \
              --notes "Automated Android build from $GITHUB_SHA" \
              --latest
          fi
